[package]
name = "cleanify"
version = "0.1.0"
description = "Modular Windows utility: analyze first, never delete without consent, everything reversible."
authors = ["Cleanify contributors"]
license = "MIT"
repository = "https://github.com/OWNER/cleanify"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cleanify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` powers the shutdown timer's tray countdown and cancel menu.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# T-5 / T-1 minute warnings for the shutdown timer.
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
thiserror = "2.0.19"
rusqlite = { version = "0.40.1", features = ["bundled"] }
# Shared parallel walker for the scanner (ARCHITECTURE section 1).
jwalk = "0.9"
# Rule-pack path patterns; case-insensitive matching for Windows paths.
globset = "0.4"
# `std::fs::canonicalize` hands back `\\?\` verbatim paths, which compare
# differently from every path the rest of the app has ever seen. `dunce` returns
# the plain form whenever Win32 accepts one, so the protected-path gate can
# canonicalise before it matches (security review C1).
dunce = "1.0.5"
# This app deletes things: every executed item gets an audit line.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
tempfile = "3.27.0"

# Win32 calls (recycle bin shell API, SetSuspendState) live behind the wrappers
# in `core/platform`, never called directly from module code.
[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Power",
    "Win32_UI_Shell",
] }

