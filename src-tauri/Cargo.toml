[package]
name = "winknife"
version = "0.4.0"
description = "Modular Windows utility: analyze first, never delete without consent, everything reversible."
authors = ["WinKnife contributors"]
license = "MIT"
repository = "https://github.com/armadavalor/WinKnife"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "winknife_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` powers the shutdown timer's tray countdown and cancel menu.
tauri = { version = "2", features = ["tray-icon"] }
# T-5 / T-1 minute warnings for the shutdown timer.
tauri-plugin-notification = "2"
# One running WinKnife: a second launch forwards its argv (`--module <id>`) to
# the first and exits, so two copies never share the database or re-arm the
# same persisted shutdown timer (phase 5 task 1, issue #3).
tauri-plugin-single-instance = "2"
# File Unlocker: native file/folder picker (open dialog only).
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
thiserror = "2.0.19"
rusqlite = { version = "0.40.1", features = ["bundled"] }
# Rule-pack path patterns; case-insensitive matching for Windows paths.
globset = "0.4"
# Duplicate detection: blake3 for the staged partial/full hashes, rayon for the
# full-hash pass (module spec 03).
blake3 = "1.5"
rayon = "1.10"
# `std::fs::canonicalize` hands back `\\?\` verbatim paths, which compare
# differently from every path the rest of the app has ever seen. `dunce` returns
# the plain form whenever Win32 accepts one, so the protected-path gate can
# canonicalise before it matches (security review C1).
dunce = "1.0.5"
# This app deletes things: every executed item gets an audit line.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
# `tauri::test` — the mock runtime and `get_ipc_response`, which is the only way
# to prove a command's managed state actually resolves. Tauri looks state up by
# `TypeId` at *runtime*, so a `State<'_, Database>` parameter against a managed
# `Arc<Database>` type-checks and then fails on every invocation; nothing short
# of dispatching through the real IPC path can see it
# (`tests/command_wiring.rs`). Dev-only: resolver 2 keeps this feature out of
# `cargo build --release`.
tauri = { version = "2", features = ["test"] }

# Win32 calls (recycle bin shell API, SetSuspendState) live behind the wrappers
# in `core/platform`, never called directly from module code.
[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    # Authenticode publisher lookup for the startup manager
    # (core/platform/signature.rs).
    "Win32_Security_Cryptography",
    # Catalog-signed binaries: almost everything Windows ships carries no
    # embedded signature at all (security review M18).
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_WinTrust",
    # The startup manager reads Run/RunOnce and writes the StartupApproved
    # flags through `core/platform/registry.rs`.
    "Win32_System_Registry",
    # `ITaskService`, the COM interface module spec 05 prefers over parsing
    # `schtasks` output (core/platform/tasks.rs).
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_TaskScheduler",
    "Win32_System_Variant",
    # `owner_process_absent` needs the process list; `Toolhelp32Snapshot` is the
    # cheapest read-only way to ask (core/platform/process.rs).
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Power",
    # The network page lists sockets with their owning process
    # (core/platform/network.rs, K-023). Read-only.
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    # The restore-point helper: `SRSetRestorePointW`, the read-only WMI
    # `SystemRestore` list for the 24-hour check, and waiting on the elevated
    # helper's exit code (core/platform/restore_point.rs, module spec 09).
    "Win32_System_Restore",
    "Win32_System_Threading",
    "Win32_System_Wmi",
    # The file unlocker asks the Restart Manager who holds a file, and reads
    # a holder's start time and exe path (core/platform/restart_manager.rs).
    "Win32_System_RestartManager",
    "Win32_UI_Shell",
    # A native error box when the app cannot start, e.g. a database written by
    # a newer build (core/platform/message.rs).
    "Win32_UI_WindowsAndMessaging",
] }

