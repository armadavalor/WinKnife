name: Release candidate

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Verify version and safety-test settings
        shell: pwsh
        run: |
          if ($env:WINKNIFE_ALLOW_SKIP_LINK_TESTS) { throw 'Safety-test opt-outs are forbidden in releases.' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq winknife | Select-Object -ExpandProperty version
          if ($version -ne $tauriVersion -or $version -ne $cargoVersion) { throw 'Package versions disagree.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package versions disagree.' }
          "WINKNIFE_VERSION=$version" >> $env:GITHUB_ENV
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
        env:
          WINKNIFE_EFS_TESTS: "1"
      - run: npm run check
      - run: npm run test:ui
      - run: npm run tauri build -- --bundles nsis
      # Optional SignPath signing (docs/SIGNING.md). Every step below is skipped
      # unless the SIGNPATH_API_TOKEN secret exists, so without it the workflow
      # packages the unsigned installer exactly as before. Signing happens before
      # packaging so SHA256SUMS.txt is computed over the signed installer.
      # A step's own env is not visible to its `if`, and `secrets` is not
      # allowed there, so one step turns "is the secret set" into an output.
      - name: Check whether signing is configured
        id: signing
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $enabled = if ($env:SIGNPATH_API_TOKEN) { 'true' } else { 'false' }
          "enabled=$enabled" >> $env:GITHUB_OUTPUT
          "SignPath signing enabled: $enabled"
      - name: Upload unsigned installer for signing
        id: upload-unsigned
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: winknife-unsigned-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - name: Submit signing request to SignPath
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # A human approves each request in SignPath; allow time for that.
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signpath-signed
      - name: Replace unsigned installer with the signed one
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signed = @(Get-ChildItem signpath-signed -Filter '*-setup.exe' -File)
          if ($signed.Count -ne 1) { throw 'Expected exactly one signed installer from SignPath.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $signed[0].FullName
          if ($signature.Status -ne 'Valid') { throw "Signed installer has an invalid signature: $($signature.Status)" }
          $target = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if ($target.Count -ne 1) { throw 'Expected exactly one unsigned installer to replace.' }
          Copy-Item -LiteralPath $signed[0].FullName -Destination $target[0].FullName -Force
          "Signed: $($signature.SignerCertificate.Subject)"
      - name: Package portable app, installer and checksums
        shell: pwsh
        run: ./scripts/package-release.ps1 -Version $env:WINKNIFE_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: winknife-release-candidate
          path: release-artifacts/*
          if-no-files-found: error
      - name: Create draft release for tag
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          Release candidate. Read docs/RELEASING.md before publishing.

          The portable ZIP includes the required rules directory. Windows WebView2 is required.
          SHA-256 checksums are attached in SHA256SUMS.txt.
          Fresh-VM acceptance and VirusTotal result links must be recorded before publication.
          "@
          $notes | Set-Content release-notes.md -Encoding utf8
          $assets = Get-ChildItem release-artifacts -File | Select-Object -ExpandProperty FullName
          gh release create $env:GITHUB_REF_NAME @assets --draft --verify-tag --title "WinKnife $env:GITHUB_REF_NAME" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed; inspect the existing release before retrying.' }
