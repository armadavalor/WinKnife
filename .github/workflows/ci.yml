name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # This is a Windows-only desktop app; the whole matrix is one runner.
  RUST_BACKTRACE: 1

jobs:
  build:
    name: clippy, test, build (windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install UI dependencies
        run: npm ci

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: TypeScript / Svelte check
        run: npm run check

      - name: Build UI
        run: npm run build

      - name: Build app
        run: npm run tauri build

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: cleanify-portable
          path: src-tauri/target/release/cleanify.exe
          if-no-files-found: error

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: cleanify-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
