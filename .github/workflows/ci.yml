name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      temp_files:
        description: Temp fixture size for the e2e job (100000 = the "huge Temp" case)
        required: false
        default: "5000"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # This is a Windows-only desktop app; the whole matrix is one runner.
  RUST_BACKTRACE: 1

jobs:
  build:
    name: clippy, test, build (windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # 22.6+ is required: `node --test` only expands glob patterns and
          # strips TypeScript types from that version on, and `npm run test:ui`
          # relies on both. 20 silently found no test files and then failed.
          node-version: 24
          cache: npm

      - name: Install UI dependencies
        run: npm ci

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # The three link-dependent safety tests (the walker never follows a link,
      # a link into a protected directory is refused, a walk root that resolves
      # into one is refused) fail rather than skip unless
      # WINKNIFE_ALLOW_SKIP_LINK_TESTS=1 is set. That opt-out exists for a
      # developer machine without Developer Mode; CI must never set it, because
      # `windows-latest` runs elevated enough to create symlinks and therefore
      # really does exercise them. This step makes "somebody set it" a build
      # failure rather than a silent loss of coverage (security review M11).
      - name: Refuse to let safety tests skip
        shell: pwsh
        run: |
          if ($env:WINKNIFE_ALLOW_SKIP_LINK_TESTS) {
            Write-Error "WINKNIFE_ALLOW_SKIP_LINK_TESTS is set in CI; the link-dependent safety tests would skip."
            exit 1
          }
          Write-Host "Link-dependent safety tests will run for real."

      - name: Rust tests
        working-directory: src-tauri
        # The EFS tests are opt-in so a contributor's `cargo test` never makes
        # Windows create an EFS key; CI runs them.
        env:
          WINKNIFE_EFS_TESTS: "1"
        run: cargo test

      - name: TypeScript / Svelte check
        run: npm run check

      # The squarified treemap layout is arithmetic, and arithmetic that is out
      # by a few percent produces a picture that looks completely convincing.
      # These assert the properties a picture cannot show you: the rectangles
      # tile the box, their areas are proportional, nothing overlaps.
      - name: UI unit tests
        run: npm run test:ui

      - name: Build UI
        run: npm run build

      - name: Build app
        run: npm run tauri build

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: winknife-portable
          path: src-tauri/target/release/winknife.exe
          if-no-files-found: error

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: winknife-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  # Drives the installed app over the WebView2 DevTools protocol on a dirty
  # fixture profile (docs/QA-PLAN.md). It really cleans and restores, so it
  # only ever runs on this throwaway runner, against C:\Users\QA. Not on push
  # to main: PRs and manual runs are where a regression should be caught.
  e2e:
    name: e2e on a dirty profile (windows)
    needs: build
    if: github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QA_HOME: C:\Users\QA
      TEMP_FILES: ${{ inputs.temp_files || '5000' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: winknife-installer
          path: dl

      - name: Install
        shell: pwsh
        run: |
          $exe = Get-ChildItem dl -Filter *-setup.exe | Select-Object -First 1
          Start-Process $exe.FullName -ArgumentList '/S' -Wait
          $app = Join-Path $env:LOCALAPPDATA 'WinKnife\winknife.exe'
          if (-not (Test-Path $app)) { throw "winknife.exe not installed" }
          "APP=$app" >> $env:GITHUB_ENV

      # Generator, app and tests share one step: the fixture's lock-helper
      # process must still hold its file when the unlocker test runs.
      - name: Dirty profile, launch, run e2e
        shell: pwsh
        run: |
          ./scripts/qa/New-DirtyProfile.ps1 -Root $env:QA_HOME -TempFiles ([int]$env:TEMP_FILES)
          $env:USERPROFILE = $env:QA_HOME
          $env:HOMEPATH = '\Users\QA'
          $env:LOCALAPPDATA = "$env:QA_HOME\AppData\Local"
          $env:APPDATA = "$env:QA_HOME\AppData\Roaming"
          $env:TEMP = "$env:QA_HOME\AppData\Local\Temp"
          $env:TMP = $env:TEMP
          $env:USERNAME = 'QA'
          # Same as demo.yml: only the machine-wide per-app policy opens the
          # DevTools port on the elevated runner. Throwaway runner only.
          $key = 'HKLM:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Force $key | Out-Null
          New-ItemProperty -Force $key -Name 'winknife.exe' -Value '--remote-debugging-port=9222' | Out-Null
          $p = Start-Process $env:APP -PassThru
          node scripts/qa/e2e.mjs "$env:QA_HOME\winknife-fixture.json" e2e-out
          $code = $LASTEXITCODE
          if ($p.HasExited) { "app exited early with $($p.ExitCode)" }
          Stop-Process -Id $p.Id -ErrorAction SilentlyContinue
          exit $code

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: e2e-out
          if-no-files-found: ignore
